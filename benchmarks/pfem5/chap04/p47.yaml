id: pfem5_ch04_p47_p47
title: PFEM Program 4.7 (p47) — 4.7 Analysis of plates using 4-node rectangular plate elements. — case
  p47
purpose: Analysis using dynamics formulation in 2D.
authors:
  source:
    book: Programming the Finite Element Method
    edition: 5th
    chapter: 4
    program: p47
    dataset: p47
  entry:
    created_by: Naeem
    created_on: '2026-01-15'
    verified_platform: Linux (gfortran)
code:
  language: Fortran (F2003)
  source_file: source/chap04/p47.f03
  uses_modules:
  - main
  - geom
  io_reads_from_unit10:
  - line: 27
    stmt: READ(10,*)nxe,nye,np_types,aa,bb,th
  - line: 33
    stmt: READ(10,*)prop
  - line: 35
    stmt: IF(np_types>1)read(10,*)etype
  - line: 43
    stmt: READ(10,*)nr,(k,nf(:,k),i=1,nr)
  - line: 87
    stmt: READ(10,*)loaded_nodes,(k,loads(nf(:,k)),i=1,loaded_nodes)
  - line: 88
    stmt: READ(10,*)fixed_freedoms
  - line: 92
    stmt: READ(10,*)(node(i),sense(i),value(i),i=1,fixed_freedoms)
fem:
  dimension: 2
  dof:
    per_node: 2
analysis:
  physics: dynamics
  type: nonlinear
  regime: steady-state
units:
  system: consistent
  notes: PFEM assumes consistent units. Choose a unit system and maintain consistency.
tunable_parameters:
- name: mesh_parameters
  path: inputs.record1
  type: int
  notes: Mesh configuration (elements, nodes, divisions)
- name: material_properties
  path: inputs.record2.prop
  type: real
  notes: Material properties (E, nu, density, etc.)
- name: applied_loads
  path: inputs.record5
  type: real
  notes: Applied nodal or distributed loads
input_schema:
  file_type: .dat
  reads_in_order:
  - record: 1
    fortran_read: READ(10,*)nxe,nye,np_types,aa,bb,th
    variables:
    - nxe
    - nye
    - np_types
    - aa
    - bb
    - th
  - record: 2
    fortran_read: READ(10,*)prop
    variables:
    - prop
  - record: 3
    fortran_read: IF(np_types>1)read(10,*)etype
    variables:
    - etype
    condition: only if np_types>1
  - record: 4
    fortran_read: READ(10,*)nr,(k,nf(:,k),i=1,nr)
    variables:
    - nr
    - (k
    - 'nf(:'
    - k)
    - i=1
    - nr)
  - record: 5
    fortran_read: READ(10,*)loaded_nodes,(k,loads(nf(:,k)),i=1,loaded_nodes)
    variables:
    - loaded_nodes
    - (k
    - 'loads(nf(:'
    - k))
    - i=1
    - loaded_nodes)
  - record: 6
    fortran_read: READ(10,*)fixed_freedoms
    variables:
    - fixed_freedoms
  - record: 7
    fortran_read: READ(10,*)(node(i),sense(i),value(i),i=1,fixed_freedoms)
    variables:
    - (node(i)
    - sense(i)
    - value(i)
    - i=1
    - fixed_freedoms)
inputs:
  working_directory: executable/chap04
  basename: p47
  dat_file: executable/chap04/p47.dat
  record1:
    raw_value: 2  2  1
    description: Values for nxe, nye, np_types, aa, bb, th
  record2:
    raw_value: 0.25  0.25  1.0
    description: Values for prop
  record3:
    raw_value: 10.92  0.3
    description: Values for etype
  record4:
    raw_value: '8'
    description: Values for nr, (k, nf(:, k), i=1, nr)
  record5:
    raw_value: 1 0 0 0 1   2 0 0 1 1   3 0 0 1 0   4 0 1 0 1
    description: Values for loaded_nodes, (k, loads(nf(:, k)), i=1, loaded_nodes)
  record6:
    raw_value: 6 1 0 1 0   7 0 1 0 0   8 1 1 0 0   9 1 0 0 0
    description: Values for fixed_freedoms
  record7:
    raw_value: '1'
    description: Values for (node(i), sense(i), value(i), i=1, fixed_freedoms)
outputs:
  output_directory: executable/chap04
  files_expected:
  - p47.res
  - p47.msh
how_to_run:
  linux:
  - cd ~/Downloads/pfem5/5th_ed/executable/chap04
  - printf "p47\n" | ~/Downloads/pfem5/5th_ed/build/bin/p47
  matlab:
  - pfem_root = '~/Downloads/pfem5/5th_ed';
  - '[status, outputs] = pfem_runner(pfem_root, ''chap04'', ''p47'', ''p47'');'
notes:
- Program prompts for the base name of the .dat file (do not type the .dat extension).
- This case has 7 READ(10,*) statements reading from the .dat file.
