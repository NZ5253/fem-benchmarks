id: pfem5_ch04_p44_p44_2
title: PFEM Program 4.4 (p44) — 4.4 Analysis of elastic rigid-jointed frames using 2-node — case p44_2
purpose: Analysis using linear elasticity formulation in 3D.
authors:
  source:
    book: Programming the Finite Element Method
    edition: 5th
    chapter: 4
    program: p44
    dataset: p44_2
  entry:
    created_by: Naeem
    created_on: '2026-01-15'
    verified_platform: Linux (gfortran)
code:
  language: Fortran (F2003)
  source_file: source/chap04/p44.f03
  uses_modules:
  - main
  - geom
  io_reads_from_unit10:
  - line: 23
    stmt: READ(10,*)nels,nn,ndim,nprops,np_types
  - line: 30
    stmt: READ(10,*)prop
  - line: 32
    stmt: IF(np_types>1)READ(10,*)etype
  - line: 33
    stmt: IF(ndim==3)READ(10,*)gamma
  - line: 34
    stmt: READ(10,*)g_coord
  - line: 35
    stmt: READ(10,*)g_num
  - line: 37
    stmt: READ(10,*)nr,(k,nf(:,k),i=1,nr)
  - line: 66
    stmt: READ(10,*)loaded_nodes,(k,loads(nf(:,k)),i=1,loaded_nodes)
  - line: 67
    stmt: READ(10,*)fixed_freedoms
  - line: 71
    stmt: READ(10,*)(node(i),sense(i),value(i),i=1,fixed_freedoms)
fem:
  dimension: 3
  dof:
    per_node: 3
analysis:
  physics: linear elasticity
  type: linear
  regime: steady-state
units:
  system: consistent
  notes: PFEM assumes consistent units. Choose a unit system and maintain consistency.
tunable_parameters:
- name: material_properties
  path: inputs.record1.prop
  type: real
  notes: Material properties (E, nu, density, etc.)
- name: mesh_parameters
  path: inputs.record1
  type: int
  notes: Mesh configuration (elements, nodes, divisions)
- name: material_properties
  path: inputs.record2.prop
  type: real
  notes: Material properties (E, nu, density, etc.)
- name: nodal_coordinates
  path: inputs.record5
  type: real
  notes: Node  coordinate values
- name: applied_loads
  path: inputs.record8
  type: real
  notes: Applied nodal or distributed loads
input_schema:
  file_type: .dat
  reads_in_order:
  - record: 1
    fortran_read: READ(10,*)nels,nn,ndim,nprops,np_types
    variables:
    - nels
    - nn
    - ndim
    - nprops
    - np_types
  - record: 2
    fortran_read: READ(10,*)prop
    variables:
    - prop
  - record: 3
    fortran_read: IF(np_types>1)READ(10,*)etype
    variables:
    - etype
    condition: only if np_types>1
  - record: 4
    fortran_read: IF(ndim==3)READ(10,*)gamma
    variables:
    - gamma
    condition: only if ndim==3
  - record: 5
    fortran_read: READ(10,*)g_coord
    variables:
    - g_coord
  - record: 6
    fortran_read: READ(10,*)g_num
    variables:
    - g_num
  - record: 7
    fortran_read: READ(10,*)nr,(k,nf(:,k),i=1,nr)
    variables:
    - nr
    - (k
    - 'nf(:'
    - k)
    - i=1
    - nr)
  - record: 8
    fortran_read: READ(10,*)loaded_nodes,(k,loads(nf(:,k)),i=1,loaded_nodes)
    variables:
    - loaded_nodes
    - (k
    - 'loads(nf(:'
    - k))
    - i=1
    - loaded_nodes)
  - record: 9
    fortran_read: READ(10,*)fixed_freedoms
    variables:
    - fixed_freedoms
  - record: 10
    fortran_read: READ(10,*)(node(i),sense(i),value(i),i=1,fixed_freedoms)
    variables:
    - (node(i)
    - sense(i)
    - value(i)
    - i=1
    - fixed_freedoms)
inputs:
  working_directory: executable/chap04
  basename: p44_2
  dat_file: executable/chap04/p44_2.dat
  record1:
    raw_value: 3   4   3  4  1
    description: Values for nels, nn, ndim, nprops, np_types
  record2:
    raw_value: 4.0e6  1.0e6  0.3e6  0.3e6
    description: Values for prop
  record3:
    raw_value: 0.0   0.0  90.0
    description: Values for etype
  record4:
    raw_value: 0.0   5.0   5.0
    description: Values for gamma
  record5:
    raw_value: 5.0   5.0   5.0
    description: Values for g_coord
  record6:
    raw_value: 5.0   5.0   0.0
    description: Values for g_num
  record7:
    raw_value: 5.0   0.0   0.0
    description: Values for nr, (k, nf(:, k), i=1, nr)
  record8:
    raw_value: 1 2  3 2  4 3
    description: Values for loaded_nodes, (k, loads(nf(:, k)), i=1, loaded_nodes)
  record9:
    raw_value: '2'
    description: Values for fixed_freedoms
  record10:
    raw_value: 1 0 0 0 0 0 0   4 0 0 0 0 0 0
    description: Values for (node(i), sense(i), value(i), i=1, fixed_freedoms)
outputs:
  output_directory: executable/chap04
  files_expected:
  - p44_2.res
  - p44_2.msh
how_to_run:
  linux:
  - cd ~/Downloads/pfem5/5th_ed/executable/chap04
  - printf "p44_2\n" | ~/Downloads/pfem5/5th_ed/build/bin/p44
  matlab:
  - pfem_root = '~/Downloads/pfem5/5th_ed';
  - '[status, outputs] = pfem_runner(pfem_root, ''chap04'', ''p44'', ''p44_2'');'
notes:
- Program prompts for the base name of the .dat file (do not type the .dat extension).
- This case has 10 READ(10,*) statements reading from the .dat file.
