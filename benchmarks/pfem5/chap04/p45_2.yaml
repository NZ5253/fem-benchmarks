- name: stiffness_E_or_EI
  global_token_index: 6
  line: 2
  type: real
  description: Young's modulus E or flexural stiffness EI
  unit_category: stress
  current_value: '1.0'
  suggested_range:
  - 0.01
  - 100.0
- name: mass_per_length_rhoA
  global_token_index: 7
  line: 2
  type: real
  description: Mass per unit length (rho * area)
  unit_category: density
  current_value: 1.e4
  suggested_range:
  - 100.0
  - 1000000.0
- name: newmark_gamma
  global_token_index: 8
  line: 2
  type: real
  description: Newmark gamma (0.5=linear acceleration)
  unit_category: dimensionless
  current_value: 1.e4
  suggested_range:
  - 0.5
  - 1.0
- name: nels_or_nxe
  global_token_index: 1
  line: 1
  type: int
  description: Number of elements (nels) or x-divisions (nxe)
  unit_category: count
  current_value: '12'
