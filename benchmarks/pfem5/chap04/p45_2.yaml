  notes: PFEM assumes consistent units. Choose a unit system and maintain consistency.
tunable_parameters:
- name: material_properties
  path: inputs.record1.prop
  type: real
  notes: Material properties (E, nu, density, etc.)
- name: mesh_parameters
  path: inputs.record1
  type: int
  notes: Mesh configuration (elements, nodes, divisions)
- name: material_properties
  path: inputs.record2.prop
  type: real
  notes: Material properties (E, nu, density, etc.)
- name: nodal_coordinates
  path: inputs.record5
  type: real
  notes: Node  coordinate values
- name: applied_loads
  path: inputs.record8
  type: real
  notes: Applied nodal or distributed loads
- name: applied_loads
  path: inputs.record9
  type: real
  notes: Applied nodal or distributed loads
- name: applied_loads
  path: inputs.record11
  type: real
  notes: Applied nodal or distributed loads
input_schema:
  file_type: .dat
  reads_in_order:
  - record: 1
    fortran_read: READ(10,*)nels,nn,ndim,nprops,np_types
    variables:
    - nels
    - nn
    - ndim
    - nprops
    - np_types
  - record: 2
    fortran_read: READ(10,*)prop
    variables:
    - prop
  - record: 3
    fortran_read: IF(np_types>1)READ(10,*)etype
    variables:
    - etype
    condition: only if np_types>1
  - record: 4
    fortran_read: IF(ndim==3)READ(10,*)gamma
    variables:
    - gamma
    condition: only if ndim==3
  - record: 5
    fortran_read: READ(10,*)g_coord
    variables:
    - g_coord
  - record: 6
    fortran_read: READ(10,*)g_num
    variables:
    - g_num
  - record: 7
    fortran_read: READ(10,*)nr,(k,nf(:,k),i=1,nr)
    variables:
    - nr
    - (k
    - 'nf(:'
    - k)
    - i=1
    - nr)
  - record: 8
    fortran_read: READ(10,*)loaded_nodes
    variables:
    - loaded_nodes
  - record: 9
    fortran_read: READ(10,*)(node(i),val(i,:),i=1,loaded_nodes)
    variables:
    - (node(i)
    - val(i
    - :)
    - i=1
    - loaded_nodes)
  - record: 10
    fortran_read: READ(10,*)limit,tol,incs
    variables:
    - limit
    - tol
    - incs
  - record: 11
    fortran_read: READ(10,*)dload
    variables:
    - dload
