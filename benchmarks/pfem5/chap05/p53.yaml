    variables:
    - (k
    - 'loads(nf(:'
    - k))
    - i=1
    - loaded_nodes)
    conditional: true
  - record: 8
    fortran_read: READ(10,*)fixed_freedoms
    variables:
    - fixed_freedoms
  - record: 9
    fortran_read: READ(10,*)(node(i),sense(i),value(i),i=1,fixed_freedoms)
    variables:
    - (node(i)
    - sense(i)
    - value(i)
    - i=1
    - fixed_freedoms)
