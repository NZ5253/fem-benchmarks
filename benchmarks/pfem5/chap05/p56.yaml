fem:
  dimension: 3
  dof:
    per_node: 3
analysis:
  physics: linear elasticity
  type: linear
  regime: steady-state
units:
  system: consistent
  notes: PFEM assumes consistent units.
tunable_parameters:
- name: cg_tolerance
  global_token_index: 6
  line: 2
  type: real
  description: Conjugate gradient convergence tolerance
  unit_category: dimensionless
  current_value: '1.0e-5'
  suggested_range:
  - 1.0e-14
  - 0.01
- name: cg_iteration_limit
  global_token_index: 7
  line: 2
  type: int
  description: CG maximum iterations
  unit_category: count
  current_value: '200'
  suggested_range:
  - 100
  - 1000000
- name: youngs_modulus_E
  global_token_index: 9
  line: 4
  type: real
  description: Young's modulus
  unit_category: stress
  current_value: '100.0'
  suggested_range:
  - 1.0
  - 10000.0
- name: poisson_ratio_nu
  global_token_index: 10
  line: 4
  type: real
  description: Poisson's ratio
  unit_category: dimensionless
  current_value: '0.3'
  suggested_range:
  - 0.0
  - 0.49
- name: nels_or_nxe
  global_token_index: 1
  line: 1
  type: int
  description: Number of elements (nels) or x-divisions (nxe)
  unit_category: count
  current_value: '20'
  note: 'WARNING: changing this invalidates coordinate arrays'
- name: np_types_or_nye
  global_token_index: 2
  line: 2
  type: int
  description: Material types (np_types) or y-divisions (nye)
  unit_category: count
  current_value: '1'
