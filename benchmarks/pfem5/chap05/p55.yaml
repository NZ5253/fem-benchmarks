  suggested_range:
  - 0.0
  - 0.49
- name: density_rho
  global_token_index: 11
  line: 4
  type: real
  description: Mass density
  unit_category: density
  current_value: '1.E-5'
  suggested_range:
  - 0.001
  - 100000.0
- name: yield_stress
  global_token_index: 12
  line: 4
  type: real
  description: Yield stress
  unit_category: stress
  current_value: '1.E-5'
  suggested_range:
  - 10.0
  - 1000000.0
