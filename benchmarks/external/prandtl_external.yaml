id: external_prandtl
title: "Prandtl bearing capacity (external Python solver)"
purpose: >
  Fixture for the Phase 3 M4 external backend. A minimal Python script
  reads yield_stress from an input file, writes P_lim = (2 + pi) * yield_stress
  to an output file. Cross-checked against PFEM p61 and against the analytic
  backend in test_external_backend.
authors:
  created_by: Naeem
runner:
  type: external
  input_template: prandtl_input.tmpl       # resolved next to this YAML
  input_file: input.txt
  command: "python3 {yaml_dir}/prandtl.py {input_file} {output_file}"
  cwd: repo_root
  output_file: result.txt
  output_parse:
    pattern: 'P_lim\s*=\s*([+-]?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)'
    group: 1
  output:
    label: P_lim
    unit: kPa
tunable_parameters:
  - name: yield_stress
    current_value: 100.0
    type: real
    unit: kPa
    description: "Tresca yield stress; matches PFEM p61 sigma_y default."
    suggested_range: [50.0, 500.0]
